# Builds the project and runs every check (tests/run_all.sh) on each push and pull request.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # the full history: tests/test_progress_units.py reads the tree of an earlier commit
          # (the commit docs/PROGRESS.md's tables name), which a shallow checkout does not have
          fetch-depth: 0

      - name: Install elan (the toolchain itself comes from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache the toolchain and .lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The external checkers (scripts/external_checkers.py) build two kernels and re-check an export of
      # about 770 MB; they run in scripts/release_check.sh before every release, not here yet.
      - name: Run all checks
        env:
          SKIP_EXTERNAL: "1"
        run: bash tests/run_all.sh
