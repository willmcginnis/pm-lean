<text x="40.0" y="60.0" font-size="22" font-weight="700" class="t1">Comparing across</text>
<rect x="24.0" y="42.0" width="6.0" height="24.0" rx="2" class="g2"/>
<text x="24.0" y="86.0" font-size="13.5" class="t2">The same statements compared with other readings of PM, with mainstream mathematics, and with the</text>
<text x="24.0" y="103.8" font-size="13.5" class="t2">printed text; and exported to formalization platforms, whose proofs come back to be checked here.</text>
