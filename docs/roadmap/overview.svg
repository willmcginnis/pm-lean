<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1002" viewBox="0 0 900 1002" role="img" aria-labelledby="title desc">
<title id="title">Roadmap overview</title>
<desc id="desc">The four groups of work, with their status, and the five milestones.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
