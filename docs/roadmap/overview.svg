<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahc"/></marker></defs>
<rect x="0" y="0" width="900" height="1002" class="bg"/>
<rect x="24.0" y="109.8" width="418.0" height="236.0" rx="6" class="card"/>
<rect x="24.0" y="109.8" width="6.0" height="236.0" rx="2" class="g0"/>
<rect x="458.0" y="109.8" width="418.0" height="236.0" rx="6" class="card"/>
<rect x="458.0" y="109.8" width="6.0" height="236.0" rx="2" class="g1"/>
<rect x="24.0" y="361.8" width="418.0" height="236.0" rx="6" class="card"/>
<rect x="24.0" y="361.8" width="6.0" height="236.0" rx="2" class="g2"/>
<rect x="458.0" y="361.8" width="418.0" height="236.0" rx="6" class="card"/>
<rect x="458.0" y="361.8" width="6.0" height="236.0" rx="2" class="g3"/>
<line x1="24" y1="704.04" x2="876" y2="704.04" class="rule"/>
<text x="24.0" y="42.0" font-size="24" font-weight="700" class="t1">Roadmap</text>
<text x="24.0" y="68.0" font-size="14" class="t2">Four groups of work run side by side. Each is split into subgroups and chapter-sized or</text>
<text x="24.0" y="86.5" font-size="14" class="t2">stage-sized tasks; every task starts with a search for prior work.</text>
<text x="44.0" y="139.8" font-size="18" font-weight="700" class="t1">1  PM itself</text>
<text x="44.0" y="163.8" font-size="13.5" class="t2">Formalize the text, volume by volume and</text>
<text x="44.0" y="181.7" font-size="13.5" class="t2">chapter by chapter, and check PM's claims</text>
<text x="44.0" y="199.5" font-size="13.5" class="t2">about its own system as each chapter is</text>
<text x="44.0" y="217.3" font-size="13.5" class="t2">reached.</text>
<text x="44.0" y="245.5" font-size="13" class="t1">Vol I (1910) · PM's claims about its own</text>
<text x="44.0" y="262.7" font-size="13" class="t1">system · Vol II (1912) · Vol III (1913) · 1925</text>
<text x="44.0" y="279.9" font-size="13" class="t1">second edition</text>
<circle cx="49.0" cy="305.9" r="5" class="st"/>
<text x="58.0" y="310.0" font-size="12.5" class="t2">5 done</text>
<circle cx="125.5" cy="305.9" r="5" class="sto"/>
<path d="M125.5,300.9 A5,5 0 0 0 125.5,310.9 Z" class="st"/>
<text x="134.5" y="310.0" font-size="12.5" class="t2">12 in progress</text>
<circle cx="264.0" cy="305.9" r="5" class="sto"/>
<text x="273.0" y="310.0" font-size="12.5" class="t2">20 not started</text>
<text x="478.0" y="139.8" font-size="18" font-weight="700" class="t1">2  Checking underneath</text>
<text x="478.0" y="163.8" font-size="13.5" class="t2">One source, many checkers: the same</text>
<text x="478.0" y="181.7" font-size="13.5" class="t2">derivations re-checked by independent</text>
<text x="478.0" y="199.5" font-size="13.5" class="t2">kernels, by Metamath and Rocq checkers, and</text>
<text x="478.0" y="217.3" font-size="13.5" class="t2">in ZFC; and Lean's own kernel verified for</text>
<text x="478.0" y="235.1" font-size="13.5" class="t2">the fragment the project uses.</text>
<text x="478.0" y="263.4" font-size="13" class="t1">Independent Lean kernels · Metamath and Rocq ·</text>
<text x="478.0" y="280.5" font-size="13" class="t1">set.mm and ZFC · Lean's own kernel · Lean and</text>
<text x="478.0" y="297.7" font-size="13" class="t1">ZFC: relative consistency</text>
<circle cx="483.0" cy="323.7" r="5" class="st"/>
<text x="492.0" y="327.8" font-size="12.5" class="t2">2 done</text>
<circle cx="559.5" cy="323.7" r="5" class="sto"/>
<path d="M559.5,318.7 A5,5 0 0 0 559.5,328.7 Z" class="st"/>
<text x="568.5" y="327.8" font-size="12.5" class="t2">1 in progress</text>
<circle cx="690.2" cy="323.7" r="5" class="sto"/>
<text x="699.2" y="327.8" font-size="12.5" class="t2">20 not started</text>
<text x="44.0" y="391.8" font-size="18" font-weight="700" class="t1">3  Comparing across</text>
<text x="44.0" y="415.8" font-size="13.5" class="t2">The same statements compared with other</text>
<text x="44.0" y="433.6" font-size="13.5" class="t2">readings of PM, with mainstream</text>
<text x="44.0" y="451.4" font-size="13.5" class="t2">mathematics, and with the printed text; and</text>
<text x="44.0" y="469.3" font-size="13.5" class="t2">exported to formalization platforms, whose</text>
<text x="44.0" y="487.1" font-size="13.5" class="t2">proofs come back to be checked here.</text>
<text x="44.0" y="515.3" font-size="13" class="t1">Other readings of PM · Mainstream mathematics</text>
<text x="44.0" y="532.5" font-size="13" class="t1">(Mathlib), in a separate package · The printed</text>
<text x="44.0" y="549.6" font-size="13" class="t1">text · Formalization platforms</text>
<circle cx="49.0" cy="575.6" r="5" class="st"/>
<text x="58.0" y="579.8" font-size="12.5" class="t2">1 done</text>
<circle cx="125.5" cy="575.6" r="5" class="sto"/>
<path d="M125.5,570.6 A5,5 0 0 0 125.5,580.6 Z" class="st"/>
<text x="134.5" y="579.8" font-size="12.5" class="t2">5 in progress</text>
<circle cx="256.2" cy="575.6" r="5" class="sto"/>
<text x="265.2" y="579.8" font-size="12.5" class="t2">4 not started</text>
<text x="478.0" y="391.8" font-size="18" font-weight="700" class="t1">4  Results about PM</text>
<text x="478.0" y="415.8" font-size="13.5" class="t2">Metatheorems about the formalized system:</text>
<text x="478.0" y="433.6" font-size="13.5" class="t2">adequacy, incompleteness, the finitist audit,</text>
<text x="478.0" y="451.4" font-size="13.5" class="t2">WKL₀ and decision procedures.</text>
<text x="478.0" y="479.7" font-size="13" class="t1">Finite syntax and adequacy · Incompleteness ·</text>
<text x="478.0" y="496.8" font-size="13" class="t1">Finitist audit · WKL₀ · Decision procedures</text>
<circle cx="483.0" cy="522.8" r="5" class="st"/>
<text x="492.0" y="527.0" font-size="12.5" class="t2">0 done</text>
<circle cx="559.5" cy="522.8" r="5" class="sto"/>
<path d="M559.5,517.8 A5,5 0 0 0 559.5,527.8 Z" class="st"/>
<text x="568.5" y="527.0" font-size="12.5" class="t2">1 in progress</text>
<circle cx="690.2" cy="522.8" r="5" class="sto"/>
<text x="699.2" y="527.0" font-size="12.5" class="t2">17 not started</text>
<text x="24.0" y="631.8" font-size="18" font-weight="700" class="t1">Milestones</text>
<text x="24.0" y="653.8" font-size="13" class="t2">Each is named by what is true when it is reached. They are not walls between phases: the gates are</text>
<text x="24.0" y="670.9" font-size="13" class="t2">dependencies between individual tasks, shown in the dependency view.</text>
<path d="M95.0,695.04 L104.0,704.04 L95.0,713.04 L86.0,704.04 Z" class="ms"/>
<text x="30.0" y="738.0" font-size="14.5" font-weight="700" class="t1">Vol I</text>
<text x="30.0" y="757.2" font-size="14.5" font-weight="700" class="t1">checked</text>
<text x="30.0" y="777.7" font-size="12.5" class="t2">✱1–✱97 derived</text>
<text x="30.0" y="794.2" font-size="12.5" class="t2">or listed; Vol</text>
<text x="30.0" y="810.7" font-size="12.5" class="t2">I's claims</text>
<text x="30.0" y="827.2" font-size="12.5" class="t2">checked or</text>
<text x="30.0" y="843.7" font-size="12.5" class="t2">marked</text>
<text x="30.0" y="863.7" font-size="12" class="t3">work in group 1</text>
<path d="M237.0,695.04 L246.0,704.04 L237.0,713.04 L228.0,704.04 Z" class="ms"/>
<text x="172.0" y="738.0" font-size="14.5" font-weight="700" class="t1">Vol II</text>
<text x="172.0" y="757.2" font-size="14.5" font-weight="700" class="t1">checked</text>
<text x="172.0" y="777.7" font-size="12.5" class="t2">✱100–✱234 the</text>
<text x="172.0" y="794.2" font-size="12.5" class="t2">same</text>
<text x="172.0" y="814.2" font-size="12" class="t3">work in group 1</text>
<path d="M379.0,695.04 L388.0,704.04 L379.0,713.04 L370.0,704.04 Z" class="ms"/>
<text x="314.0" y="738.0" font-size="14.5" font-weight="700" class="t1">Vol III</text>
<text x="314.0" y="757.2" font-size="14.5" font-weight="700" class="t1">checked</text>
<text x="314.0" y="777.7" font-size="12.5" class="t2">✱250–✱375 the</text>
<text x="314.0" y="794.2" font-size="12.5" class="t2">same, from the</text>
<text x="314.0" y="810.7" font-size="12.5" class="t2">proofread text</text>
<text x="314.0" y="830.7" font-size="12" class="t3">work in group 1</text>
<path d="M521.0,695.04 L530.0,704.04 L521.0,713.04 L512.0,704.04 Z" class="ms"/>
<text x="456.0" y="738.0" font-size="14.5" font-weight="700" class="t1">First</text>
<text x="456.0" y="757.2" font-size="14.5" font-weight="700" class="t1">edition</text>
<text x="456.0" y="776.3" font-size="14.5" font-weight="700" class="t1">audited</text>
<text x="456.0" y="796.8" font-size="12.5" class="t2">volumes, text,</text>
<text x="456.0" y="813.3" font-size="12.5" class="t2">assumption</text>
<text x="456.0" y="829.8" font-size="12.5" class="t2">census and</text>
<text x="456.0" y="846.3" font-size="12.5" class="t2">comparisons</text>
<text x="456.0" y="862.8" font-size="12.5" class="t2">complete</text>
<text x="456.0" y="882.8" font-size="12" class="t3">work in groups</text>
<text x="456.0" y="898.6" font-size="12" class="t3">1, 3, 4</text>
<path d="M663.0,695.04 L672.0,704.04 L663.0,713.04 L654.0,704.04 Z" class="ms"/>
<text x="598.0" y="738.0" font-size="14.5" font-weight="700" class="t1">Lean's</text>
<text x="598.0" y="757.2" font-size="14.5" font-weight="700" class="t1">kernel</text>
<text x="598.0" y="776.3" font-size="14.5" font-weight="700" class="t1">fragment</text>
<text x="598.0" y="795.5" font-size="14.5" font-weight="700" class="t1">verified</text>
<text x="598.0" y="815.9" font-size="12.5" class="t2">the kernel</text>
<text x="598.0" y="832.4" font-size="12.5" class="t2">fragment the</text>
<text x="598.0" y="848.9" font-size="12.5" class="t2">project uses,</text>
<text x="598.0" y="865.4" font-size="12.5" class="t2">re-checked by a</text>
<text x="598.0" y="881.9" font-size="12.5" class="t2">checker proved</text>
<text x="598.0" y="898.4" font-size="12.5" class="t2">correct</text>
<text x="598.0" y="918.4" font-size="12" class="t3">work in group 2</text>
<path d="M805.0,695.04 L814.0,704.04 L805.0,713.04 L796.0,704.04 Z" class="ms"/>
<text x="740.0" y="738.0" font-size="14.5" font-weight="700" class="t1">The</text>
<text x="740.0" y="757.2" font-size="14.5" font-weight="700" class="t1">derivations'</text>
<text x="740.0" y="776.3" font-size="14.5" font-weight="700" class="t1">fragment of</text>
<text x="740.0" y="795.5" font-size="14.5" font-weight="700" class="t1">Lean</text>
<text x="740.0" y="814.6" font-size="14.5" font-weight="700" class="t1">grounded in</text>
<text x="740.0" y="833.7" font-size="14.5" font-weight="700" class="t1">ZF</text>
<text x="740.0" y="854.2" font-size="12.5" class="t2">our restricted</text>
<text x="740.0" y="870.7" font-size="12.5" class="t2">checker proved</text>
<text x="740.0" y="887.2" font-size="12.5" class="t2">sound in ZF</text>
<text x="740.0" y="903.7" font-size="12.5" class="t2">(Lean and</text>
<text x="740.0" y="920.2" font-size="12.5" class="t2">set.mm) and in</text>
<text x="740.0" y="936.7" font-size="12.5" class="t2">PM's ramified</text>
<text x="740.0" y="953.2" font-size="12.5" class="t2">theory</text>
<text x="740.0" y="973.2" font-size="12" class="t3">work in group 2</text>
</svg>
