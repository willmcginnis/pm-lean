<svg xmlns="http://www.w3.org/2000/svg" width="900" height="876" viewBox="0 0 900 876" role="img" aria-labelledby="title desc">
<title id="title">Roadmap overview</title>
<desc id="desc">The four groups of work, with their status, and the five milestones.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.bg{fill:#fcfcfb}
.card{fill:#ffffff;stroke:#d6d5cf;stroke-width:1}
.band{fill:#f3f3f0}
.rule{stroke:#d6d5cf;stroke-width:1}
.t1{fill:#0b0b0b}
.t2{fill:#52514e}
.t3{fill:#62615c}
.st{fill:#52514e;stroke:#52514e}
.sto{fill:none;stroke:#52514e;stroke-width:1.5}
.edge{fill:none;stroke:#55544f;stroke-width:1.3}
.choice{fill:none;stroke:#8a5a00;stroke-width:1.5;stroke-dasharray:5 3}
.ah{fill:#55544f}
.ahc{fill:#8a5a00}
.ms{fill:#0b0b0b}
.g0{fill:#2a78d6}
.gs0{stroke:#2a78d6;stroke-width:2;fill:none}
.g1{fill:#eb6834}
.gs1{stroke:#eb6834;stroke-width:2;fill:none}
.g2{fill:#1baf7a}
.gs2{stroke:#1baf7a;stroke-width:2;fill:none}
.g3{fill:#eda100}
.gs3{stroke:#eda100;stroke-width:2;fill:none}
@media (prefers-color-scheme: dark) {
.bg{fill:#1a1a19}
.card{fill:#232322;stroke:#45443f;stroke-width:1}
.band{fill:#2b2b29}
.rule{stroke:#45443f;stroke-width:1}
.t1{fill:#ffffff}
.t2{fill:#c3c2b7}
.t3{fill:#b0afa5}
.st{fill:#c3c2b7;stroke:#c3c2b7}
.sto{fill:none;stroke:#c3c2b7;stroke-width:1.5}
.edge{fill:none;stroke:#b8b7ad;stroke-width:1.3}
.choice{fill:none;stroke:#e3b04b;stroke-width:1.5;stroke-dasharray:5 3}
.ah{fill:#b8b7ad}
.ahc{fill:#e3b04b}
.ms{fill:#ffffff}
.g0{fill:#3987e5}
.gs0{stroke:#3987e5;stroke-width:2;fill:none}
.g1{fill:#d95926}
.gs1{stroke:#d95926;stroke-width:2;fill:none}
.g2{fill:#199e70}
.gs2{stroke:#199e70;stroke-width:2;fill:none}
.g3{fill:#c98500}
.gs3{stroke:#c98500;stroke-width:2;fill:none}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahc"/></marker></defs>
<rect x="0" y="0" width="900" height="876" class="bg"/>
<rect x="24.0" y="109.8" width="418.0" height="236.0" rx="6" class="card"/>
<rect x="24.0" y="109.8" width="6.0" height="236.0" rx="2" class="g0"/>
<rect x="458.0" y="109.8" width="418.0" height="236.0" rx="6" class="card"/>
<rect x="458.0" y="109.8" width="6.0" height="236.0" rx="2" class="g1"/>
<rect x="24.0" y="361.8" width="418.0" height="200.3" rx="6" class="card"/>
<rect x="24.0" y="361.8" width="6.0" height="200.3" rx="2" class="g2"/>
<rect x="458.0" y="361.8" width="418.0" height="200.3" rx="6" class="card"/>
<rect x="458.0" y="361.8" width="6.0" height="200.3" rx="2" class="g3"/>
<line x1="24" y1="668.3999999999999" x2="876" y2="668.3999999999999" class="rule"/>
<text x="24.0" y="42.0" font-size="24" font-weight="700" class="t1">Roadmap</text>
<text x="24.0" y="68.0" font-size="14" class="t2">Four groups of work run side by side. Each is split into subgroups and chapter-sized or</text>
<text x="24.0" y="86.5" font-size="14" class="t2">stage-sized tasks; every task starts with a search for prior work.</text>
<text x="44.0" y="139.8" font-size="18" font-weight="700" class="t1">1  PM itself</text>
<text x="44.0" y="163.8" font-size="13.5" class="t2">Formalize the text, volume by volume and</text>
<text x="44.0" y="181.7" font-size="13.5" class="t2">chapter by chapter, and check PM's claims</text>
<text x="44.0" y="199.5" font-size="13.5" class="t2">about its own system as each chapter is</text>
<text x="44.0" y="217.3" font-size="13.5" class="t2">reached.</text>
<text x="44.0" y="245.5" font-size="13" class="t1">Vol I (1910) · Vol II (1912) · Vol III (1913)</text>
<text x="44.0" y="262.7" font-size="13" class="t1">· 1925 second edition</text>
<circle cx="49.0" cy="288.7" r="5" class="st"/>
<text x="58.0" y="292.8" font-size="12.5" class="t2">2 done</text>
<circle cx="125.5" cy="288.7" r="5" class="sto"/>
<path d="M125.5,283.7 A5,5 0 0 0 125.5,293.7 Z" class="st"/>
<text x="134.5" y="292.8" font-size="12.5" class="t2">5 in progress</text>
<circle cx="256.2" cy="288.7" r="5" class="sto"/>
<text x="265.2" y="292.8" font-size="12.5" class="t2">20 not started</text>
<text x="478.0" y="139.8" font-size="18" font-weight="700" class="t1">2  Checking underneath</text>
<text x="478.0" y="163.8" font-size="13.5" class="t2">One source, many checkers: the same</text>
<text x="478.0" y="181.7" font-size="13.5" class="t2">derivations re-checked by independent</text>
<text x="478.0" y="199.5" font-size="13.5" class="t2">kernels, by Metamath and Rocq checkers, and</text>
<text x="478.0" y="217.3" font-size="13.5" class="t2">in ZFC; and Lean's own kernel verified for</text>
<text x="478.0" y="235.1" font-size="13.5" class="t2">the fragment the project uses.</text>
<text x="478.0" y="263.4" font-size="13" class="t1">Independent Lean kernels · Metamath and Rocq ·</text>
<text x="478.0" y="280.5" font-size="13" class="t1">set.mm and ZFC · Lean's own kernel · Lean and</text>
<text x="478.0" y="297.7" font-size="13" class="t1">ZFC: relative consistency</text>
<circle cx="483.0" cy="323.7" r="5" class="st"/>
<text x="492.0" y="327.8" font-size="12.5" class="t2">0 done</text>
<circle cx="559.5" cy="323.7" r="5" class="sto"/>
<path d="M559.5,318.7 A5,5 0 0 0 559.5,328.7 Z" class="st"/>
<text x="568.5" y="327.8" font-size="12.5" class="t2">0 in progress</text>
<circle cx="690.2" cy="323.7" r="5" class="sto"/>
<text x="699.2" y="327.8" font-size="12.5" class="t2">15 not started</text>
<text x="44.0" y="391.8" font-size="18" font-weight="700" class="t1">3  Comparing across</text>
<text x="44.0" y="415.8" font-size="13.5" class="t2">The same statements compared with other</text>
<text x="44.0" y="433.6" font-size="13.5" class="t2">readings of PM, with mainstream</text>
<text x="44.0" y="451.4" font-size="13.5" class="t2">mathematics, and with the printed text.</text>
<text x="44.0" y="479.7" font-size="13" class="t1">Other readings of PM · Mainstream mathematics</text>
<text x="44.0" y="496.8" font-size="13" class="t1">(Mathlib), in a separate package · The printed</text>
<text x="44.0" y="514.0" font-size="13" class="t1">text</text>
<circle cx="49.0" cy="540.0" r="5" class="st"/>
<text x="58.0" y="544.1" font-size="12.5" class="t2">0 done</text>
<circle cx="125.5" cy="540.0" r="5" class="sto"/>
<path d="M125.5,535.0 A5,5 0 0 0 125.5,545.0 Z" class="st"/>
<text x="134.5" y="544.1" font-size="12.5" class="t2">4 in progress</text>
<circle cx="256.2" cy="540.0" r="5" class="sto"/>
<text x="265.2" y="544.1" font-size="12.5" class="t2">4 not started</text>
<text x="478.0" y="391.8" font-size="18" font-weight="700" class="t1">4  Results about PM</text>
<text x="478.0" y="415.8" font-size="13.5" class="t2">Metatheorems about the formalized system:</text>
<text x="478.0" y="433.6" font-size="13.5" class="t2">adequacy, incompleteness, the finitist audit,</text>
<text x="478.0" y="451.4" font-size="13.5" class="t2">WKL₀ and decision procedures.</text>
<text x="478.0" y="479.7" font-size="13" class="t1">Finite syntax and adequacy · Incompleteness ·</text>
<text x="478.0" y="496.8" font-size="13" class="t1">Finitist audit · WKL₀ · Decision procedures</text>
<circle cx="483.0" cy="522.8" r="5" class="st"/>
<text x="492.0" y="527.0" font-size="12.5" class="t2">0 done</text>
<circle cx="559.5" cy="522.8" r="5" class="sto"/>
<path d="M559.5,517.8 A5,5 0 0 0 559.5,527.8 Z" class="st"/>
<text x="568.5" y="527.0" font-size="12.5" class="t2">1 in progress</text>
<circle cx="690.2" cy="522.8" r="5" class="sto"/>
<text x="699.2" y="527.0" font-size="12.5" class="t2">16 not started</text>
<text x="24.0" y="596.1" font-size="18" font-weight="700" class="t1">Milestones</text>
<text x="24.0" y="618.1" font-size="13" class="t2">Each is named by what is true when it is reached. They are not walls between phases: the gates are</text>
<text x="24.0" y="635.3" font-size="13" class="t2">dependencies between individual tasks, shown in the dependency view.</text>
<path d="M109.2,659.3999999999999 L118.2,668.3999999999999 L109.2,677.3999999999999 L100.2,668.3999999999999 Z" class="ms"/>
<text x="30.0" y="702.4" font-size="14.5" font-weight="700" class="t1">Vol I checked</text>
<text x="30.0" y="722.9" font-size="12.5" class="t2">✱1–✱97 derived or</text>
<text x="30.0" y="739.4" font-size="12.5" class="t2">listed; Vol I's</text>
<text x="30.0" y="755.9" font-size="12.5" class="t2">claims checked or</text>
<text x="30.0" y="772.4" font-size="12.5" class="t2">marked</text>
<text x="30.0" y="792.4" font-size="12" class="t3">work in group 1</text>
<path d="M279.6,659.3999999999999 L288.6,668.3999999999999 L279.6,677.3999999999999 L270.6,668.3999999999999 Z" class="ms"/>
<text x="200.4" y="702.4" font-size="14.5" font-weight="700" class="t1">Vol II checked</text>
<text x="200.4" y="722.9" font-size="12.5" class="t2">✱100–✱234 the same</text>
<text x="200.4" y="742.9" font-size="12" class="t3">work in group 1</text>
<path d="M450.0,659.3999999999999 L459.0,668.3999999999999 L450.0,677.3999999999999 L441.0,668.3999999999999 Z" class="ms"/>
<text x="370.8" y="702.4" font-size="14.5" font-weight="700" class="t1">Vol III checked</text>
<text x="370.8" y="722.9" font-size="12.5" class="t2">✱250–✱375 the</text>
<text x="370.8" y="739.4" font-size="12.5" class="t2">same, from the</text>
<text x="370.8" y="755.9" font-size="12.5" class="t2">proofread text</text>
<text x="370.8" y="775.9" font-size="12" class="t3">work in group 1</text>
<path d="M620.4,659.3999999999999 L629.4,668.3999999999999 L620.4,677.3999999999999 L611.4,668.3999999999999 Z" class="ms"/>
<text x="541.2" y="702.4" font-size="14.5" font-weight="700" class="t1">First edition</text>
<text x="541.2" y="721.5" font-size="14.5" font-weight="700" class="t1">audited</text>
<text x="541.2" y="742.0" font-size="12.5" class="t2">volumes, text,</text>
<text x="541.2" y="758.5" font-size="12.5" class="t2">assumption census</text>
<text x="541.2" y="775.0" font-size="12.5" class="t2">and comparisons</text>
<text x="541.2" y="791.5" font-size="12.5" class="t2">complete</text>
<text x="541.2" y="811.5" font-size="12" class="t3">work in groups 1, 3,</text>
<text x="541.2" y="827.4" font-size="12" class="t3">4</text>
<path d="M790.8,659.3999999999999 L799.8,668.3999999999999 L790.8,677.3999999999999 L781.8,668.3999999999999 Z" class="ms"/>
<text x="711.6" y="702.4" font-size="14.5" font-weight="700" class="t1">Lean's kernel</text>
<text x="711.6" y="721.5" font-size="14.5" font-weight="700" class="t1">fragment</text>
<text x="711.6" y="740.7" font-size="14.5" font-weight="700" class="t1">verified</text>
<text x="711.6" y="761.2" font-size="12.5" class="t2">the kernel fragment</text>
<text x="711.6" y="777.7" font-size="12.5" class="t2">the project uses,</text>
<text x="711.6" y="794.2" font-size="12.5" class="t2">re-checked by a</text>
<text x="711.6" y="810.7" font-size="12.5" class="t2">checker proved</text>
<text x="711.6" y="827.2" font-size="12.5" class="t2">correct</text>
<text x="711.6" y="847.2" font-size="12" class="t3">work in group 2</text>
</svg>
