<text x="42.0" y="923.6" font-size="12" class="t2">needs: pm.mm ✱1–✱5</text>
<text x="326.0" y="867.2" font-size="13" font-weight="700" class="t1">A model of PM's types in</text>
<text x="326.0" y="884.9" font-size="13" font-weight="700" class="t1">ZFC: each primitive</text>
<text x="326.0" y="902.6" font-size="13" font-weight="700" class="t1">proposition and rule proved</text>
<text x="326.0" y="920.3" font-size="13" font-weight="700" class="t1">true once</text>
<circle cx="331.0" cy="936.9" r="5" class="sto"/>
<text x="342.0" y="940.9" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="958.9" font-size="12" class="t2">needs: finite core</text>
<text x="610.0" y="867.2" font-size="13" font-weight="700" class="t1">Every exported derivation</text>
<text x="610.0" y="884.9" font-size="13" font-weight="700" class="t1">transferred through the</text>
<text x="610.0" y="902.6" font-size="13" font-weight="700" class="t1">model</text>
