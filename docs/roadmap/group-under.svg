<text x="42.0" y="1496.1" font-size="13" font-weight="700" class="t1">Lean proves Con(ZFC):</text>
<text x="42.0" y="1513.7" font-size="13" font-weight="700" class="t1">existing mechanizations</text>
<text x="42.0" y="1531.4" font-size="13" font-weight="700" class="t1">cited and re-checked</text>
