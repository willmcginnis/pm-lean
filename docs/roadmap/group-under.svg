<text x="42.0" y="701.2" font-size="12" class="t2">from ✱20</text>
<text x="326.0" y="628.5" font-size="13" font-weight="700" class="t1">Rocq re-check: our own</text>
<text x="326.0" y="646.2" font-size="13" font-weight="700" class="t1">small checker for our</text>
<text x="326.0" y="663.9" font-size="13" font-weight="700" class="t1">certificate format, proved</text>
<text x="326.0" y="681.6" font-size="13" font-weight="700" class="t1">sound in Rocq</text>
<circle cx="331.0" cy="698.3" r="5" class="sto"/>
