<text x="313.4" y="129.1" font-size="12" class="t2">S, M, L: weeks, months, longer</text>
<text x="24.0" y="155.1" font-size="12" class="t3">needs: the tasks whose results this one requires (its gates). Later by choice: placed after other work by the</text>
<text x="24.0" y="170.9" font-size="12" class="t3">maintainer's priorities, not because it must wait.</text>
<text x="30.0" y="218.8" font-size="15" font-weight="700" class="t1">Independent Lean kernels</text>
<text x="42.0" y="258.8" font-size="13" font-weight="700" class="t1">Independent Lean kernels</text>
<text x="42.0" y="276.5" font-size="13" font-weight="700" class="t1">re-check the build in CI,</text>
<text x="42.0" y="294.1" font-size="13" font-weight="700" class="t1">one checker per code family</text>
<circle cx="47.0" cy="310.8" r="5" class="sto"/>
