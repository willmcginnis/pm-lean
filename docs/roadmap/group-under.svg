<text x="326.0" y="720.3" font-size="12" class="t2">needs: finite core</text>
<text x="326.0" y="736.6" font-size="12" class="t2">later by choice: after pm.mm</text>
<text x="326.0" y="752.9" font-size="12" class="t2">✱9–✱14</text>
<text x="30.0" y="827.2" font-size="15" font-weight="700" class="t1">set.mm and ZFC</text>
<text x="42.0" y="867.2" font-size="13" font-weight="700" class="t1">set.mm: replay ✱1–✱5</text>
<text x="42.0" y="884.9" font-size="13" font-weight="700" class="t1">inside ZFC</text>
