<text x="610.0" y="941.3" font-size="12" class="t2">needs: ZFC model of PM's types,</text>
<text x="610.0" y="957.6" font-size="12" class="t2">pm.mm ✱9–✱14</text>
<text x="30.0" y="1033.3" font-size="15" font-weight="700" class="t1">Lean's own kernel</text>
<text x="42.0" y="1073.3" font-size="13" font-weight="700" class="t1">(a) Census of the kernel</text>
<text x="42.0" y="1090.9" font-size="13" font-weight="700" class="t1">features the project</text>
<text x="42.0" y="1108.6" font-size="13" font-weight="700" class="t1">exercises</text>
<circle cx="47.0" cy="1125.3" r="5" class="st"/>
<text x="58.0" y="1129.3" font-size="12" class="t2">done · size S</text>
<text x="326.0" y="1073.3" font-size="13" font-weight="700" class="t1">(b) Lean in Lean: Lean4Lean</text>
<text x="326.0" y="1090.9" font-size="13" font-weight="700" class="t1">re-checks the build</text>
<circle cx="331.0" cy="1107.6" r="5" class="sto"/>
<text x="342.0" y="1111.6" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="1129.6" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="610.0" y="1073.3" font-size="13" font-weight="700" class="t1">(b1) An instrumented</text>
<text x="610.0" y="1090.9" font-size="13" font-weight="700" class="t1">independent checker that</text>
<text x="610.0" y="1108.6" font-size="13" font-weight="700" class="t1">counts what a static census</text>
<text x="610.0" y="1126.3" font-size="13" font-weight="700" class="t1">cannot (proof irrelevance,</text>
<text x="610.0" y="1144.0" font-size="13" font-weight="700" class="t1">eta, unit-like types, K</text>
<text x="610.0" y="1161.7" font-size="13" font-weight="700" class="t1">versus iota, literal to</text>
<text x="610.0" y="1179.3" font-size="13" font-weight="700" class="t1">constructor)</text>
<circle cx="615.0" cy="1196.0" r="5" class="sto"/>
<text x="626.0" y="1200.0" font-size="12" class="t2">not started · size M</text>
<text x="610.0" y="1218.0" font-size="12" class="t2">needs: Lean4Lean run</text>
<text x="42.0" y="1272.3" font-size="13" font-weight="700" class="t1">(c) A restricted checker</text>
<text x="42.0" y="1290.0" font-size="13" font-weight="700" class="t1">for that fragment: first</text>
<text x="42.0" y="1307.7" font-size="13" font-weight="700" class="t1">existing verified checkers</text>
<text x="42.0" y="1325.4" font-size="13" font-weight="700" class="t1">(con-leche), then our own</text>
<text x="42.0" y="1343.1" font-size="13" font-weight="700" class="t1">only if needed</text>
<circle cx="47.0" cy="1359.7" r="5" class="sto"/>
<text x="58.0" y="1363.7" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="1381.7" font-size="12" class="t2">needs: kernel census</text>
<text x="326.0" y="1272.3" font-size="13" font-weight="700" class="t1">(d) A formal proof that the</text>
<text x="326.0" y="1290.0" font-size="13" font-weight="700" class="t1">checker used is correct</text>
<text x="326.0" y="1307.7" font-size="13" font-weight="700" class="t1">against a specification of</text>
<text x="326.0" y="1325.4" font-size="13" font-weight="700" class="t1">the fragment</text>
<circle cx="331.0" cy="1342.1" r="5" class="sto"/>
<text x="342.0" y="1346.1" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="1364.1" font-size="12" class="t2">needs: restricted checker</text>
