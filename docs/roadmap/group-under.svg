<text x="30.0" y="407.1" font-size="15" font-weight="700" class="t1">Metamath and Rocq</text>
<text x="42.0" y="447.1" font-size="13" font-weight="700" class="t1">A small, readable</text>
<text x="42.0" y="464.8" font-size="13" font-weight="700" class="t1">independent checker written</text>
<text x="42.0" y="482.5" font-size="13" font-weight="700" class="t1">for this project (a</text>
<text x="42.0" y="500.2" font-size="13" font-weight="700" class="t1">Metamath verifier in a few</text>
<text x="42.0" y="517.9" font-size="13" font-weight="700" class="t1">hundred lines), chosen for</text>
<text x="42.0" y="535.5" font-size="13" font-weight="700" class="t1">clarity over speed</text>
<circle cx="47.0" cy="552.2" r="5" class="sto"/>
<text x="58.0" y="556.2" font-size="12" class="t2">not started · size S</text>
<text x="42.0" y="574.2" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="326.0" y="447.1" font-size="13" font-weight="700" class="t1">pm.mm for ✱1–✱5, from the</text>
<text x="326.0" y="464.8" font-size="13" font-weight="700" class="t1">finite propositional core,</text>
<text x="326.0" y="482.5" font-size="13" font-weight="700" class="t1">checked by several Metamath</text>
<text x="326.0" y="500.2" font-size="13" font-weight="700" class="t1">verifiers</text>
<circle cx="331.0" cy="516.9" r="5" class="sto"/>
