<text x="24.0" y="30.0" font-size="12.5" class="t3">Group 2 of 4</text>
<text x="40.0" y="60.0" font-size="22" font-weight="700" class="t1">Checking underneath</text>
<rect x="24.0" y="42.0" width="6.0" height="24.0" rx="2" class="g1"/>
<text x="24.0" y="86.0" font-size="13.5" class="t2">One source, many checkers: the same derivations re-checked by independent kernels, by Metamath and</text>
<text x="24.0" y="103.8" font-size="13.5" class="t2">Rocq checkers, and in ZFC; and Lean's own kernel verified for the fragment the project uses.</text>
<circle cx="29.0" cy="124.6" r="5" class="st"/>
<text x="38.0" y="129.1" font-size="12" class="t2">done</text>
<circle cx="90.8" cy="124.6" r="5" class="sto"/>
