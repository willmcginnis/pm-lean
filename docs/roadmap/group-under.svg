<text x="326.0" y="538.9" font-size="12" class="t2">needs: adequacy ✱1–✱5</text>
<text x="610.0" y="447.1" font-size="13" font-weight="700" class="t1">pm.mm for ✱9–✱14, from</text>
<text x="610.0" y="464.8" font-size="13" font-weight="700" class="t1">the finite first-order core:</text>
<text x="610.0" y="482.5" font-size="13" font-weight="700" class="t1">binding, substitution,</text>
<text x="610.0" y="500.2" font-size="13" font-weight="700" class="t1">distinct-variable conditions</text>
