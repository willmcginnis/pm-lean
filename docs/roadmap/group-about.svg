<text x="24.0" y="30.0" font-size="12.5" class="t3">Group 4 of 4</text>
<text x="40.0" y="60.0" font-size="22" font-weight="700" class="t1">Results about PM</text>
<rect x="24.0" y="42.0" width="6.0" height="24.0" rx="2" class="g3"/>
<text x="24.0" y="86.0" font-size="13.5" class="t2">Metatheorems about the formalized system: adequacy, incompleteness, the finitist audit, WKL₀ and</text>
<text x="24.0" y="103.8" font-size="13.5" class="t2">decision procedures.</text>
<circle cx="29.0" cy="124.6" r="5" class="st"/>
<text x="38.0" y="129.1" font-size="12" class="t2">done</text>
<circle cx="90.8" cy="124.6" r="5" class="sto"/>
<path d="M90.8,119.6 A5,5 0 0 0 90.8,129.6 Z" class="st"/>
<text x="99.8" y="129.1" font-size="12" class="t2">in progress</text>
<circle cx="204.6" cy="124.6" r="5" class="sto"/>
<text x="213.6" y="129.1" font-size="12" class="t2">not started</text>
<text x="313.4" y="129.1" font-size="12" class="t2">S, M, L: weeks, months, longer</text>
<text x="24.0" y="155.1" font-size="12" class="t3">needs: the tasks whose results this one requires (its gates). Later by choice: placed after other work by the</text>
<text x="24.0" y="170.9" font-size="12" class="t3">maintainer's priorities, not because it must wait.</text>
<text x="30.0" y="218.8" font-size="15" font-weight="700" class="t1">Finite syntax and adequacy</text>
<text x="42.0" y="258.8" font-size="13" font-weight="700" class="t1">Adequacy, stage 1: ✱1–✱5,</text>
<text x="42.0" y="276.5" font-size="13" font-weight="700" class="t1">a finite certificate format</text>
<text x="42.0" y="294.1" font-size="13" font-weight="700" class="t1">and both translations</text>
<circle cx="47.0" cy="310.8" r="5" class="sto"/>
<text x="58.0" y="314.8" font-size="12" class="t2">not started · size S</text>
<text x="42.0" y="332.8" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="326.0" y="258.8" font-size="13" font-weight="700" class="t1">Adequacy, stage 2: a finite</text>
<text x="326.0" y="276.5" font-size="13" font-weight="700" class="t1">first-order core for</text>
<text x="326.0" y="294.1" font-size="13" font-weight="700" class="t1">✱9–✱14, with derivations</text>
<text x="326.0" y="311.8" font-size="13" font-weight="700" class="t1">as data, and the easy</text>
<text x="326.0" y="329.5" font-size="13" font-weight="700" class="t1">direction (every core</text>
<text x="326.0" y="347.2" font-size="13" font-weight="700" class="t1">derivation gives a QThm</text>
<text x="326.0" y="364.9" font-size="13" font-weight="700" class="t1">theorem)</text>
<circle cx="331.0" cy="381.5" r="5" class="sto"/>
<text x="342.0" y="385.5" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="403.5" font-size="12" class="t2">needs: adequacy ✱1–✱5</text>
<text x="610.0" y="258.8" font-size="13" font-weight="700" class="t1">Adequacy, stage 2, the</text>
<text x="610.0" y="276.5" font-size="13" font-weight="700" class="t1">converse: from QThm back to</text>
<text x="610.0" y="294.1" font-size="13" font-weight="700" class="t1">the finite core</text>
<circle cx="615.0" cy="310.8" r="5" class="sto"/>
<text x="626.0" y="314.8" font-size="12" class="t2">not started · size L</text>
<text x="610.0" y="332.8" font-size="12" class="t2">needs: finite core</text>
<text x="42.0" y="457.9" font-size="13" font-weight="700" class="t1">Adequacy, stage 3: classes</text>
<text x="42.0" y="475.5" font-size="13" font-weight="700" class="t1">and beyond</text>
<circle cx="47.0" cy="492.2" r="5" class="sto"/>
<text x="58.0" y="496.2" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="514.2" font-size="12" class="t2">needs: finite core</text>
<text x="30.0" y="588.5" font-size="15" font-weight="700" class="t1">Incompleteness</text>
<text x="42.0" y="628.5" font-size="13" font-weight="700" class="t1">PM as a many-sorted</text>
<text x="42.0" y="646.2" font-size="13" font-weight="700" class="t1">first-order theory (the</text>
<text x="42.0" y="663.9" font-size="13" font-weight="700" class="t1">finite core), in a separate</text>
<text x="42.0" y="681.6" font-size="13" font-weight="700" class="t1">package that reuses the</text>
<text x="42.0" y="699.3" font-size="13" font-weight="700" class="t1">Foundation library</text>
<circle cx="47.0" cy="715.9" r="5" class="sto"/>
<text x="58.0" y="719.9" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="737.9" font-size="12" class="t2">needs: finite core</text>
<text x="326.0" y="628.5" font-size="13" font-weight="700" class="t1">Numbering of the core's</text>
<text x="326.0" y="646.2" font-size="13" font-weight="700" class="t1">formulas and derivations;</text>
<text x="326.0" y="663.9" font-size="13" font-weight="700" class="t1">'is a derivation of'</text>
<text x="326.0" y="681.6" font-size="13" font-weight="700" class="t1">representable</text>
<circle cx="331.0" cy="698.3" r="5" class="sto"/>
<text x="342.0" y="702.3" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="720.3" font-size="12" class="t2">needs: first-order PM</text>
<text x="610.0" y="628.5" font-size="13" font-weight="700" class="t1">Robinson's Q interpreted</text>
<text x="610.0" y="646.2" font-size="13" font-weight="700" class="t1">inside the chosen PM</text>
<text x="610.0" y="663.9" font-size="13" font-weight="700" class="t1">theory, with Infinity as</text>
<text x="610.0" y="681.6" font-size="13" font-weight="700" class="t1">hypothesis</text>
<circle cx="615.0" cy="698.3" r="5" class="sto"/>
<text x="626.0" y="702.3" font-size="12" class="t2">not started · size L</text>
<text x="610.0" y="720.3" font-size="12" class="t2">needs: ✱100–✱126</text>
<text x="42.0" y="792.3" font-size="13" font-weight="700" class="t1">Gödel's first theorem for</text>
<text x="42.0" y="809.9" font-size="13" font-weight="700" class="t1">PM, in the Gödel–Rosser</text>
<text x="42.0" y="827.6" font-size="13" font-weight="700" class="t1">form</text>
<circle cx="47.0" cy="844.3" r="5" class="sto"/>
<text x="58.0" y="848.3" font-size="12" class="t2">not started · size L</text>
<text x="42.0" y="866.3" font-size="12" class="t2">needs: first-order PM,</text>
<text x="42.0" y="882.6" font-size="12" class="t2">numbering, Q interpreted</text>
<text x="42.0" y="898.9" font-size="12" class="t2">later by choice: after</text>
<text x="42.0" y="915.3" font-size="12" class="t2">✱250–✱276, ✱300–✱375</text>
<text x="326.0" y="792.3" font-size="13" font-weight="700" class="t1">Gödel's second theorem for</text>
<text x="326.0" y="809.9" font-size="13" font-weight="700" class="t1">PM: derivability</text>
<text x="326.0" y="827.6" font-size="13" font-weight="700" class="t1">conditions, then Con</text>
<text x="326.0" y="845.3" font-size="13" font-weight="700" class="t1">unprovable</text>
<circle cx="331.0" cy="862.0" r="5" class="sto"/>
<text x="342.0" y="866.0" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="884.0" font-size="12" class="t2">needs: Gödel I, ✱90–✱97</text>
<text x="30.0" y="989.6" font-size="15" font-weight="700" class="t1">Finitist audit</text>
<text x="42.0" y="1029.6" font-size="13" font-weight="700" class="t1">Assumption provenance:</text>
<text x="42.0" y="1047.3" font-size="13" font-weight="700" class="t1">which results use</text>
<text x="42.0" y="1064.9" font-size="13" font-weight="700" class="t1">reducibility, infinity, the</text>
<text x="42.0" y="1082.6" font-size="13" font-weight="700" class="t1">multiplicative axiom</text>
<circle cx="47.0" cy="1099.3" r="5" class="sto"/>
<path d="M47.0,1094.3 A5,5 0 0 0 47.0,1104.3 Z" class="st"/>
<text x="58.0" y="1103.3" font-size="12" class="t2">in progress · size S</text>
<text x="42.0" y="1121.3" font-size="12" class="t2">needs: nothing</text>
<text x="326.0" y="1029.6" font-size="13" font-weight="700" class="t1">PRA readings: which results</text>
<text x="326.0" y="1047.3" font-size="13" font-weight="700" class="t1">have an arithmetic reading</text>
<text x="326.0" y="1064.9" font-size="13" font-weight="700" class="t1">provable in PRA</text>
<circle cx="331.0" cy="1081.6" r="5" class="sto"/>
<text x="342.0" y="1085.6" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="1103.6" font-size="12" class="t2">needs: assumption tags, PRA,</text>
<text x="326.0" y="1119.9" font-size="12" class="t2">RCA₀, WKL₀</text>
<text x="326.0" y="1136.3" font-size="12" class="t2">later by choice: after</text>
<text x="326.0" y="1152.6" font-size="12" class="t2">✱250–✱276, ✱300–✱375</text>
<text x="610.0" y="1029.6" font-size="13" font-weight="700" class="t1">Complete census of</text>
<text x="610.0" y="1047.3" font-size="13" font-weight="700" class="t1">assumptions, all three</text>
<text x="610.0" y="1064.9" font-size="13" font-weight="700" class="t1">volumes</text>
<circle cx="615.0" cy="1081.6" r="5" class="sto"/>
<text x="626.0" y="1085.6" font-size="12" class="t2">not started · size S</text>
<text x="610.0" y="1103.6" font-size="12" class="t2">needs: assumption tags,</text>
<text x="610.0" y="1119.9" font-size="12" class="t2">✱100–✱126, ✱150–✱186,</text>
<text x="610.0" y="1136.3" font-size="12" class="t2">✱200–✱234, ✱250–✱276,</text>
<text x="610.0" y="1152.6" font-size="12" class="t2">✱300–✱375</text>
<text x="30.0" y="1226.9" font-size="15" font-weight="700" class="t1">WKL₀</text>
<text x="42.0" y="1266.9" font-size="13" font-weight="700" class="t1">PRA, RCA₀ and WKL₀ as</text>
<text x="42.0" y="1284.6" font-size="13" font-weight="700" class="t1">formal systems</text>
<circle cx="47.0" cy="1301.3" r="5" class="sto"/>
<text x="58.0" y="1305.3" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="1323.3" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="42.0" y="1339.6" font-size="12" class="t2">later by choice: after Gödel I</text>
<text x="326.0" y="1266.9" font-size="13" font-weight="700" class="t1">WKL₀ is Π⁰₂-conservative</text>
<text x="326.0" y="1284.6" font-size="13" font-weight="700" class="t1">over PRA</text>
<circle cx="331.0" cy="1301.3" r="5" class="sto"/>
<text x="342.0" y="1305.3" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="1323.3" font-size="12" class="t2">needs: PRA, RCA₀, WKL₀</text>
<text x="30.0" y="1413.9" font-size="15" font-weight="700" class="t1">Decision procedures</text>
<text x="42.0" y="1453.9" font-size="13" font-weight="700" class="t1">Monadic first-order</text>
<text x="42.0" y="1471.6" font-size="13" font-weight="700" class="t1">fragment</text>
<circle cx="47.0" cy="1488.3" r="5" class="sto"/>
<text x="58.0" y="1492.3" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="1510.3" font-size="12" class="t2">needs: finite core</text>
<text x="42.0" y="1526.6" font-size="12" class="t2">later by choice: after PRA,</text>
<text x="42.0" y="1542.9" font-size="12" class="t2">RCA₀, WKL₀</text>
<text x="326.0" y="1453.9" font-size="13" font-weight="700" class="t1">Presburger arithmetic</text>
<text x="326.0" y="1471.6" font-size="13" font-weight="700" class="t1">(addition only)</text>
<circle cx="331.0" cy="1488.3" r="5" class="sto"/>
<text x="342.0" y="1492.3" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="1510.3" font-size="12" class="t2">needs: ✱100–✱126</text>
<text x="326.0" y="1526.6" font-size="12" class="t2">later by choice: after PRA,</text>
<text x="326.0" y="1542.9" font-size="12" class="t2">RCA₀, WKL₀</text>
