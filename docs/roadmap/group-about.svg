<text x="24.0" y="30.0" font-size="12.5" class="t3">Group 4 of 4</text>
<text x="40.0" y="60.0" font-size="22" font-weight="700" class="t1">Results about PM</text>
<rect x="24.0" y="42.0" width="6.0" height="24.0" rx="2" class="g3"/>
<text x="24.0" y="86.0" font-size="13.5" class="t2">Metatheorems about the formalized system: adequacy, incompleteness, the finitist audit, WKL₀ and</text>
<text x="24.0" y="103.8" font-size="13.5" class="t2">decision procedures.</text>
<circle cx="29.0" cy="124.6" r="5" class="st"/>
<text x="38.0" y="129.1" font-size="12" class="t2">done</text>
<circle cx="90.8" cy="124.6" r="5" class="sto"/>
<path d="M90.8,119.6 A5,5 0 0 0 90.8,129.6 Z" class="st"/>
<text x="99.8" y="129.1" font-size="12" class="t2">in progress</text>
<circle cx="204.6" cy="124.6" r="5" class="sto"/>
<text x="213.6" y="129.1" font-size="12" class="t2">not started</text>
<text x="313.4" y="129.1" font-size="12" class="t2">S, M, L: weeks, months, longer</text>
<text x="24.0" y="155.1" font-size="12" class="t3">needs: the tasks whose results this one requires (its gates). Later by choice: placed after other work by the</text>
<text x="24.0" y="170.9" font-size="12" class="t3">maintainer's priorities, not because it must wait.</text>
<text x="30.0" y="218.8" font-size="15" font-weight="700" class="t1">Finite syntax and adequacy</text>
<text x="42.0" y="258.8" font-size="13" font-weight="700" class="t1">Adequacy, stage 1: ✱1–✱5,</text>
<text x="42.0" y="276.5" font-size="13" font-weight="700" class="t1">a finite certificate format</text>
<text x="42.0" y="294.1" font-size="13" font-weight="700" class="t1">and both translations</text>
<circle cx="47.0" cy="310.8" r="5" class="sto"/>
<text x="58.0" y="314.8" font-size="12" class="t2">not started · size S</text>
<text x="42.0" y="332.8" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="326.0" y="258.8" font-size="13" font-weight="700" class="t1">Adequacy, stage 2: a finite</text>
<text x="326.0" y="276.5" font-size="13" font-weight="700" class="t1">first-order core for</text>
<text x="326.0" y="294.1" font-size="13" font-weight="700" class="t1">✱9–✱14, with derivations</text>
<text x="326.0" y="311.8" font-size="13" font-weight="700" class="t1">as data, and the easy</text>
<text x="326.0" y="329.5" font-size="13" font-weight="700" class="t1">direction (every core</text>
<text x="326.0" y="347.2" font-size="13" font-weight="700" class="t1">derivation gives a QThm</text>
<text x="326.0" y="364.9" font-size="13" font-weight="700" class="t1">theorem)</text>
<circle cx="331.0" cy="381.5" r="5" class="sto"/>
<text x="342.0" y="385.5" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="403.5" font-size="12" class="t2">needs: adequacy ✱1–✱5</text>
<text x="610.0" y="258.8" font-size="13" font-weight="700" class="t1">Adequacy, stage 2, the</text>
<text x="610.0" y="276.5" font-size="13" font-weight="700" class="t1">converse: from QThm back to</text>
<text x="610.0" y="294.1" font-size="13" font-weight="700" class="t1">the finite core</text>
<circle cx="615.0" cy="310.8" r="5" class="sto"/>
<text x="626.0" y="314.8" font-size="12" class="t2">not started · size L</text>
<text x="610.0" y="332.8" font-size="12" class="t2">needs: finite core</text>
<text x="42.0" y="457.9" font-size="13" font-weight="700" class="t1">Completeness of ✱9's</text>
<text x="42.0" y="475.5" font-size="13" font-weight="700" class="t1">working reading C (the</text>
<text x="42.0" y="493.2" font-size="13" font-weight="700" class="t1">definitions as printed with</text>
<text x="42.0" y="510.9" font-size="13" font-weight="700" class="t1">Russell's ✱8·13): every</text>
<text x="42.0" y="528.6" font-size="13" font-weight="700" class="t1">expression true in every</text>
<text x="42.0" y="546.3" font-size="13" font-weight="700" class="t1">structure is a theorem</text>
<circle cx="47.0" cy="562.9" r="5" class="sto"/>
<text x="58.0" y="566.9" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="584.9" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="326.0" y="457.9" font-size="13" font-weight="700" class="t1">Adequacy, stage 3: classes</text>
<text x="326.0" y="475.5" font-size="13" font-weight="700" class="t1">and beyond</text>
<circle cx="331.0" cy="492.2" r="5" class="sto"/>
<text x="342.0" y="496.2" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="514.2" font-size="12" class="t2">needs: finite core</text>
<text x="30.0" y="659.3" font-size="15" font-weight="700" class="t1">Incompleteness</text>
<text x="42.0" y="699.3" font-size="13" font-weight="700" class="t1">PM as a many-sorted</text>
<text x="42.0" y="716.9" font-size="13" font-weight="700" class="t1">first-order theory (the</text>
<text x="42.0" y="734.6" font-size="13" font-weight="700" class="t1">finite core), in a separate</text>
<text x="42.0" y="752.3" font-size="13" font-weight="700" class="t1">package that reuses the</text>
<text x="42.0" y="770.0" font-size="13" font-weight="700" class="t1">Foundation library</text>
<circle cx="47.0" cy="786.7" r="5" class="sto"/>
<text x="58.0" y="790.7" font-size="12" class="t2">not started · size M</text>
<text x="42.0" y="808.7" font-size="12" class="t2">needs: finite core</text>
<text x="326.0" y="699.3" font-size="13" font-weight="700" class="t1">Numbering of the core's</text>
<text x="326.0" y="716.9" font-size="13" font-weight="700" class="t1">formulas and derivations;</text>
<text x="326.0" y="734.6" font-size="13" font-weight="700" class="t1">'is a derivation of'</text>
<text x="326.0" y="752.3" font-size="13" font-weight="700" class="t1">representable</text>
<circle cx="331.0" cy="769.0" r="5" class="sto"/>
<text x="342.0" y="773.0" font-size="12" class="t2">not started · size M</text>
<text x="326.0" y="791.0" font-size="12" class="t2">needs: first-order PM</text>
<text x="610.0" y="699.3" font-size="13" font-weight="700" class="t1">Arithmetic interpreted</text>
<text x="610.0" y="716.9" font-size="13" font-weight="700" class="t1">inside the chosen PM</text>
<text x="610.0" y="734.6" font-size="13" font-weight="700" class="t1">theory, with Infinity as</text>
<text x="610.0" y="752.3" font-size="13" font-weight="700" class="t1">hypothesis: Robinson's Q,</text>
<text x="610.0" y="770.0" font-size="13" font-weight="700" class="t1">and IΣ₁ for the library's</text>
<text x="610.0" y="787.7" font-size="13" font-weight="700" class="t1">Gödel–Rosser theorem</text>
<circle cx="615.0" cy="804.3" r="5" class="sto"/>
<text x="626.0" y="808.3" font-size="12" class="t2">not started · size L</text>
<text x="610.0" y="826.3" font-size="12" class="t2">needs: ✱100–✱126</text>
<text x="42.0" y="880.7" font-size="13" font-weight="700" class="t1">Gödel's first theorem for</text>
<text x="42.0" y="898.3" font-size="13" font-weight="700" class="t1">PM, in the Gödel–Rosser</text>
<text x="42.0" y="916.0" font-size="13" font-weight="700" class="t1">form</text>
<circle cx="47.0" cy="932.7" r="5" class="sto"/>
<text x="58.0" y="936.7" font-size="12" class="t2">not started · size L</text>
<text x="42.0" y="954.7" font-size="12" class="t2">needs: first-order PM,</text>
<text x="42.0" y="971.0" font-size="12" class="t2">numbering, arithmetic</text>
<text x="42.0" y="987.3" font-size="12" class="t2">interpreted</text>
<text x="42.0" y="1003.7" font-size="12" class="t2">later by choice: after</text>
<text x="42.0" y="1020.0" font-size="12" class="t2">✱250–✱276, ✱300–✱375</text>
<text x="326.0" y="880.7" font-size="13" font-weight="700" class="t1">Gödel's second theorem for</text>
<text x="326.0" y="898.3" font-size="13" font-weight="700" class="t1">PM: derivability</text>
<text x="326.0" y="916.0" font-size="13" font-weight="700" class="t1">conditions, then Con</text>
<text x="326.0" y="933.7" font-size="13" font-weight="700" class="t1">unprovable</text>
<circle cx="331.0" cy="950.4" r="5" class="sto"/>
<text x="342.0" y="954.4" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="972.4" font-size="12" class="t2">needs: Gödel I, ✱90–✱97</text>
<text x="30.0" y="1094.3" font-size="15" font-weight="700" class="t1">Finitist audit</text>
<text x="42.0" y="1134.3" font-size="13" font-weight="700" class="t1">Assumption provenance:</text>
<text x="42.0" y="1152.0" font-size="13" font-weight="700" class="t1">which results use</text>
<text x="42.0" y="1169.7" font-size="13" font-weight="700" class="t1">reducibility, infinity, the</text>
<text x="42.0" y="1187.3" font-size="13" font-weight="700" class="t1">multiplicative axiom</text>
<circle cx="47.0" cy="1204.0" r="5" class="sto"/>
<path d="M47.0,1199.0 A5,5 0 0 0 47.0,1209.0 Z" class="st"/>
<text x="58.0" y="1208.0" font-size="12" class="t2">in progress · size S</text>
<text x="42.0" y="1226.0" font-size="12" class="t2">needs: nothing</text>
<text x="326.0" y="1134.3" font-size="13" font-weight="700" class="t1">PRA readings: which results</text>
<text x="326.0" y="1152.0" font-size="13" font-weight="700" class="t1">have an arithmetic reading</text>
<text x="326.0" y="1169.7" font-size="13" font-weight="700" class="t1">provable in PRA</text>
<circle cx="331.0" cy="1186.3" r="5" class="sto"/>
<text x="342.0" y="1190.3" font-size="12" class="t2">not started · size L</text>
<text x="326.0" y="1208.3" font-size="12" class="t2">needs: assumption tags, PRA,</text>
<text x="326.0" y="1224.7" font-size="12" class="t2">RCA₀, WKL₀</text>
<text x="326.0" y="1241.0" font-size="12" class="t2">later by choice: after</text>
<text x="326.0" y="1257.3" font-size="12" class="t2">✱250–✱276, ✱300–✱375</text>
<text x="610.0" y="1134.3" font-size="13" font-weight="700" class="t1">Complete census of</text>
<text x="610.0" y="1152.0" font-size="13" font-weight="700" class="t1">assumptions, all three</text>
<text x="610.0" y="1169.7" font-size="13" font-weight="700" class="t1">volumes</text>
<circle cx="615.0" cy="1186.3" r="5" class="sto"/>
<text x="626.0" y="1190.3" font-size="12" class="t2">not started · size S</text>
<text x="610.0" y="1208.3" font-size="12" class="t2">needs: assumption tags,</text>
<text x="610.0" y="1224.7" font-size="12" class="t2">✱100–✱126, ✱150–✱186,</text>
<text x="610.0" y="1241.0" font-size="12" class="t2">✱200–✱234, ✱250–✱276,</text>
<text x="610.0" y="1257.3" font-size="12" class="t2">✱300–✱375</text>
<text x="30.0" y="1331.6" font-size="15" font-weight="700" class="t1">WKL₀</text>
<text x="42.0" y="1371.6" font-size="13" font-weight="700" class="t1">PRA, RCA₀ and WKL₀ as</text>
<text x="42.0" y="1389.3" font-size="13" font-weight="700" class="t1">formal systems</text>
<circle cx="47.0" cy="1406.0" r="5" class="sto"/>
