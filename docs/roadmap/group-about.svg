<text x="42.0" y="1428.0" font-size="12" class="t2">needs: nothing; can start now</text>
<text x="42.0" y="1444.3" font-size="12" class="t2">later by choice: after Gödel I</text>
<text x="326.0" y="1371.6" font-size="13" font-weight="700" class="t1">WKL₀ is Π⁰₂-conservative</text>
<text x="326.0" y="1389.3" font-size="13" font-weight="700" class="t1">over PRA</text>
<circle cx="331.0" cy="1406.0" r="5" class="sto"/>
